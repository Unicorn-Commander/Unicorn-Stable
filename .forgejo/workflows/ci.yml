name: ci
# Gate merges: the web app must typecheck+build and the backend must compile
# and import cleanly. Prevents the "dirty tree / broken main" class of problem
# that made prod state impossible to reproduce.
#
# NOTE: requires a registered Forgejo Actions runner with Node 22 + Python 3.12
# (or Docker) available. If no runner is registered this file is inert — see
# repo README / ops notes to register one.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: production dependency audit
        run: npm run audit:prod
      - name: typecheck + build
        # `npm run build` runs `tsc -b && vite build` — this is the type gate.
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stable
          POSTGRES_PASSWORD: stable-test-password
          POSTGRES_DB: stable_identity_link_test
        options: >-
          --health-cmd "pg_isready -U stable -d stable_identity_link_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install .
      - name: compile-check (all modules)
        run: python -m compileall -q app
      - name: import smoke (config loads)
        run: python -c "import app.config; print('backend imports OK')"
      - name: websocket handshake regression gate
        # Browser-shaped upgrade probe against an ephemeral uvicorn server:
        # the 2026-07-31 outage class (bloated Cookie block on /ws). The
        # 16KiB canary WARNs on the known uvicorn websockets-sansio upgrade
        # cliff (> ~8KiB headers silently swallowed, h11 HTTP path fine).
        run: python ../scripts/ws_handshake_probe.py --serve
      - name: pytest (full server suite, incl. asyncio-marked tests)
        run: |
          pip install -q pytest pytest-asyncio
          python -m pytest -q
      - name: focused unit and behavior tests
        run: |
          python -m unittest -q tests/test_enterprise_trust.py
          python -m unittest -q tests/test_guest_access.py
          python tests/test_gather_grounding.py
          bash tests/test_entrypoint.sh
      - name: identity-link database integration test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://stable:stable-test-password@postgres:5432/stable_identity_link_test
        run: python tests/test_identity_link.py
      - name: guest row-retention database integration test
        # Its own database because both integration tests drop_all/create_all.
        # Created with asyncpg (already a dependency) rather than psql, which
        # the runner image is not guaranteed to ship.
        env:
          ADMIN_DSN: postgresql://stable:REMOVED@postgres:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://stable:stable-test-password@postgres:5432/stable_guest_retention_test
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["ADMIN_DSN"])
              try:
                  await conn.execute("CREATE DATABASE stable_guest_retention_test")
              except asyncpg.exceptions.DuplicateDatabaseError:
                  pass
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          python tests/test_guest_row_retention.py
      - name: alembic upgrade + downgrade on a FRESH database
        # The migration hazard this repo has actually been bitten by is
        # invisible on an already-migrated database and fatal on a new install
        # (014 adds an enum label; PostgreSQL refuses to USE a new label in the
        # transaction that added it). The only way to catch it is to migrate
        # from EMPTY, every time. Down-then-up proves the downgrade too.
        env:
          ADMIN_DSN: postgresql://stable:REMOVED@postgres:5432/postgres
          DATABASE_URL: postgresql+asyncpg://stable:stable-test-password@postgres:5432/stable_migration_test
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["ADMIN_DSN"])
              try:
                  await conn.execute("DROP DATABASE IF EXISTS stable_migration_test")
                  await conn.execute("CREATE DATABASE stable_migration_test")
              finally:
                  await conn.close()
              conn = await asyncpg.connect(
                  os.environ["ADMIN_DSN"].replace("/postgres", "/stable_migration_test")
              )
              try:
                  await conn.execute('CREATE EXTENSION IF NOT EXISTS "uuid-ossp"')
                  await conn.execute('CREATE EXTENSION IF NOT EXISTS "pg_trgm"')
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          pip install alembic
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # The flagship scenario, measured 2026-09-18: a database stamped BELOW
          # 018a that already carries agent_gateway_keys from the out-of-band
          # server/migrations/agent_gateway_keys.sql. 018a must skip the create,
          # not raise DuplicateTable, or that database can never upgrade again.
          alembic downgrade 018_call_egress
          python - <<'PY'
          import asyncio, os, pathlib, asyncpg
          async def main():
              conn = await asyncpg.connect(
                  os.environ["ADMIN_DSN"].replace("/postgres", "/stable_migration_test")
              )
              try:
                  await conn.execute(pathlib.Path("migrations/agent_gateway_keys.sql").read_text())
                  assert await conn.fetchval("select to_regclass('public.agent_gateway_keys') is not null")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          alembic upgrade head

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install . pytest
      - name: compile-check
        run: python -m compileall -q agent_runtime brigade_backed triage plugins
      - name: tests
        run: pytest -q
