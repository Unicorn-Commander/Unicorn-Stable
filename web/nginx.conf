# NO static `upstream` block, on purpose. nginx resolves an upstream{} host
# ONCE at startup and pins the IPs forever — during the 2026-08-05..07
# cross-stack alias-collision window this nginx pinned brand-ops-frontend and
# unicorn-keycloak as "backend:8400" and kept 502ing every WebSocket for a day
# after DNS was fixed, because nothing ever re-resolved. A variable proxy_pass
# forces per-request resolution through Docker's DNS with a short TTL, so a
# backend recreate (new IP) can never strand this proxy again.
resolver 127.0.0.11 valid=10s ipv6=off;

# Accommodate Keycloak JWT + multi-domain cookie stacks.
# Defaults (8K) overflow on SSO callbacks once a few services share the
# parent domain. 64K is overkill but harmless.
large_client_header_buffers 8 64k;
client_header_buffer_size 16k;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Which backend this web tier proxies. Substituted at container start by
    # the nginx image's envsubst (this file ships as a template) — each stack
    # sets STABLE_BACKEND_HOST to its own CONTAINER name (stable-backend /
    # stable-flagship-backend) because the short service name `backend` is
    # ambiguous on the shared `web` network. Defaults to `backend` in the
    # image for single-stack/self-host deploys.
    set $stable_backend "${STABLE_BACKEND_HOST}:8400";

    # Enterprise browser baseline. Inline styles are required by the existing
    # React component system, and the tiny pre-paint theme script in index.html
    # requires inline script until it is extracted or nonce-stamped.
    # The first-visit landing is intentionally isolated in a same-origin
    # iframe. Permit only same-origin embedding; cross-origin clickjacking
    # remains blocked by both CSP and X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com ${STABLE_CSP_EXTRA_SCRIPT}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' ${STABLE_CSP_EXTRA_FRAME}" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Source maps carry the full original source. The build still writes them
    # (deploy provenance is checked inside the image with docker exec), but
    # they are never served. Listed before the asset regex below, which would
    # otherwise not match them and fall through to `location /`.
    location ~* \.map$ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx locations that define add_header do not inherit the server's
        # add_header values, so repeat the security baseline for assets.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com ${STABLE_CSP_EXTRA_SCRIPT}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' ${STABLE_CSP_EXTRA_FRAME}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://$stable_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Big response headers too (OIDC Set-Cookie etc.)
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        # Upload body: allow up to 25 MB (backend enforces 20 MB in code).
        client_max_body_size 25m;
    }

    # The old public /uploads/ location was removed. Attachments are served by
    # the authenticated route /api/v1/uploads/{name}, proxied via /api/ below.

    location /ws {
        proxy_pass http://$stable_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Strip browser baggage the socket never uses — and that kills it.
        # uvicorn answers any request whose header block passes ~8 KiB with
        # SILENCE (no 431, no close), and deployment-domain cookies
        # alone exceed that: every browser handshake hung while cookie-less
        # curl sailed through (2026-07-31 live-updates outage, final layer).
        # WS auth is the first-frame token — cookies are dead weight here.
        # permessage-deflate is stripped too: uvicorn's negotiation of it is
        # part of the same silent-hang class, and these frames are too small
        # for compression to matter.
        proxy_set_header Cookie "";
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The SPA entry and the service worker must be revalidated on every load.
    # Without a Cache-Control header, browsers keep the previous release's
    # index.html (and so its old bundle) for hours after a deploy, on
    # heuristic freshness from Last-Modified (seen 2026-09-29 after the Nav v3
    # deploy). sw.js also matched the asset rule above and was "immutable" for
    # a year. Hashed assets stay immutable. Exact-match locations win over the
    # regex; each repeats the security baseline because a location that adds
    # headers does not inherit the server's.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com ${STABLE_CSP_EXTRA_SCRIPT}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' ${STABLE_CSP_EXTRA_FRAME}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com ${STABLE_CSP_EXTRA_SCRIPT}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' ${STABLE_CSP_EXTRA_FRAME}" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
