<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puppet lab</title>
    <style>
      body {
        margin: 0;
        background: #0f1117;
        color: #c9cbd6;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header { padding: 14px 18px 8px; }
      h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
      p { margin: 0; color: #7d8194; }
      #cols { display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 18px 0; }
      #cols span { text-align: center; color: #7d8194; }
      #lab { padding: 0 18px 18px; }
      #lab canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Portrait puppet — state grid</h1>
      <p>rows: majik · sidekick · corporal qwen · gunny · the&nbsp;general &nbsp;|&nbsp; add <code>?animate=1</code> to sweep</p>
    </header>
    <div id="cols">
      <span>closed</span><span>1/3</span><span>2/3</span><span>full</span><span>blink</span>
    </div>
    <div id="lab"></div>
    <script type="module" src="/src/puppetLab.ts"></script>
  </body>
</html>
