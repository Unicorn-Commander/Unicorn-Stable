<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Unicorn Stable — where your team and your AI agents live, talk, and work together" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b15" />
    <!-- Standard name; `apple-mobile-web-app-capable` is deprecated but kept
         alongside it because older iOS still only honours the prefixed form. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stable" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social share card. The active deployment can set absolute metadata at
         the edge; the public default remains same-origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unicorn Stable" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Stable" />
    <meta property="og:description" content="Unicorn Stable — where your team and your AI agents live, talk, and work together" />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unicorn Stable — where your team and your AI agents live, talk, and work together" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stable" />
    <meta name="twitter:description" content="Unicorn Stable — where your team and your AI agents live, talk, and work together" />
    <meta name="twitter:image" content="/og-card.png" />
    <meta name="twitter:image:alt" content="Unicorn Stable — where your team and your AI agents live, talk, and work together" />
    <link rel="canonical" href="/" />

    <title>Stable</title>
    <script>
      // Pre-paint theme stamp — no dark flash for light-mode users, and no
      // flash of the DEFAULT palette for anyone who picked another one. Both
      // axes have to be stamped here: data-theme (light/dark) and data-palette
      // (which of the five colour sets). Stamping only one still flashes.
      //
      // Reads the same keys as lib/theme.ts and stores/themeStore.ts, which own
      // the runtime, the system listener and the per-user scoping. The palette
      // key read here is the device-level "last chosen" hint — the per-user
      // value is authoritative and re-stamped by AppShell as soon as identity
      // resolves, which is the same trade lib/theme already makes.
      (function () {
        try {
          var c = localStorage.getItem("stable.theme.v1") || "system";
          var r =
            c === "light" || c === "dark"
              ? c
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = r;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", r === "light" ? "#ffffff" : "#0b0b15");
        } catch (e) {}
        try {
          var valid = ["aurora", "prism", "ember", "grove", "beacon"];
          var p = localStorage.getItem("stable.palette.v1");
          document.documentElement.dataset.palette =
            valid.indexOf(p) === -1 ? "aurora" : p;
        } catch (e) {
          document.documentElement.dataset.palette = "aurora";
        }
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
