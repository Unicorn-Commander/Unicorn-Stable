services:
  # ==========================================================================
  # LiveKit SFU Server — core real-time media & data channel infrastructure
  # ==========================================================================
  livekit:
    image: livekit/livekit-server:v1.10.1
    container_name: stable-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP / WebSocket signaling
      - "7881:7881"   # TCP media (TURN/TLS)
      - "7882:7882/udp"  # UDP media (WebRTC)
    volumes:
      - ./server/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.stable-livekit.rule=Host(`livekit.magicunicorn.dev`)"
      - "traefik.http.routers.stable-livekit.entrypoints=websecure"
      - "traefik.http.routers.stable-livekit.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stable-livekit.service=stable-livekit"
      - "traefik.http.services.stable-livekit.loadbalancer.server.port=7880"
      - "traefik.http.routers.stable-livekit-http.rule=Host(`livekit.magicunicorn.dev`)"
      - "traefik.http.routers.stable-livekit-http.entrypoints=web"
      - "traefik.http.routers.stable-livekit-http.service=stable-livekit"
      - "traefik.tcp.routers.stable-turn.rule=HostSNI(`turn.magicunicorn.dev`)"
      - "traefik.tcp.routers.stable-turn.entrypoints=websecure"
      - "traefik.tcp.routers.stable-turn.tls=true"
      - "traefik.tcp.routers.stable-turn.tls.certresolver=letsencrypt"
      - "traefik.tcp.routers.stable-turn.service=stable-turn"
      - "traefik.tcp.services.stable-turn.loadbalancer.server.port=443"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stable-net
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # LiveKit Egress — records calls (room-composite): audio-only OGG, and
  # COMPOSITE VIDEO MP4s that render our own broadcast page in a headless
  # Chrome (design §8; deploy/RECORDING.md). Registers against the SAME redis
  # as the SFU (that redis IS the egress dispatch bus); writes finished files
  # onto the shared egress_out volume, which the backend mounts at the SAME
  # path so no translation is needed. The backend starts/stops egresses via
  # the LiveKit server API and treats this whole service as optional — if
  # it's down, calls still work and the backend logs
  # call_recording_start_failed loudly.
  #
  # CAPACITY: a composite egress is a full Chrome + x264 encode (~2 cores at
  # 720p30 by LiveKit's own guidance; MEASURE on the first real call). Two
  # at once is the cap (RECORDING_MAX_COMPOSITE below). On a busy host run
  # this service on a machine with CPU headroom — NOT the LiveKit host — by
  # pointing its egress.yaml at this stack's redis + ws_url over the LAN and
  # sharing the egress_out path (NFS/bind); see deploy/RECORDING.md.
  # ==========================================================================
  egress:
    image: livekit/egress:v1.14.1
    container_name: stable-egress
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      # Real config is host-local (secrets), like server/livekit.yaml.
      # Template: server/egress.yaml.example.
      - ./server/egress.yaml:/etc/egress.yaml:ro
      - egress_out:/egress-out
    # Chromium inside the egress image needs a real /dev/shm even when a
    # request ends up on the chromeless audio-only pipeline; composites
    # render at 1280x720 (or 1920x1080) in it.
    shm_size: "1gb"
    # Audio-only fits in 2 cores; each composite wants ~2 more. Raise to
    # (2 + 2 × RECORDING_MAX_COMPOSITE) on the host that runs composites.
    cpus: ${EGRESS_CPUS:-2.0}
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    # stable-net ONLY — dials stable-redis/stable-livekit by container name;
    # nothing routes TO it.
    networks:
      - stable-net

  # ==========================================================================
  # PostgreSQL 16 — persistent storage for rooms, messages, agents, audit
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: stable-postgres
    restart: unless-stopped
    ports:
      # Loopback-only (§3): the app reaches PG over the Docker network; the
      # host port is for local psql/backup only, never off-box.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      POSTGRES_DB: stable
      POSTGRES_USER: stable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stable_dev_password_2026}
    # stable-net ONLY (2026-08-07): postgres was also on the shared `web`
    # network, where BOTH Stable stacks alias the service name `postgres` —
    # so any client resolving `postgres:5432` over `web` could land on the
    # OTHER stack's database. Nothing routes to postgres via Traefik; it has
    # no reason to be there. Same de-aliasing applied to redis/agent-runtime,
    # and all consumers now dial container names (stable-postgres, …).
    networks:
      - stable-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stable -d stable"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis 7 — presence, typing indicators, pub/sub, rate limiting, LiveKit
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: stable-redis
    restart: unless-stopped
    ports:
      # Bound to loopback (§3 hardening): this is Stable's OWN redis (rate-limit
      # counters, presence). It never needs to be reachable off-host; the app
      # talks to it over the Docker network. Also password-protected below.
      - "127.0.0.1:6381:6379"  # remapped (6380 taken by FalkorDB)
    volumes:
      - redis_data:/data
    # requirepass (§3): without it, an unauth client on the network could
    # FLUSHALL the rate-limit counters or CONFIG SET dir for a file-write RCE.
    # dangerous admin verbs are also renamed away.
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    # stable-net ONLY — see the postgres note. The 2026-08-05 reboot proved
    # this live: dogfood LiveKit resolved `redis:6379` to the FLAGSHIP redis
    # over `web` and died on WRONGPASS for 45 hours.
    networks:
      - stable-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Stable Backend — FastAPI: auth, rooms, messages, tokens, WebSocket
  # ==========================================================================
  backend:
    # Deploy scripts build :latest with immutable source labels. Do not pin an
    # old one-off tag here: `docker compose up --force-recreate` otherwise
    # silently recreates the stale image even after a successful fresh build.
    image: ${STABLE_BACKEND_IMAGE:-unicorn-stable-backend:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stable-backend
    restart: unless-stopped
    ports:
      # Loopback-only (§3/B2): the public entrypoint is Traefik on the `web`
      # network, not this host port. Nothing off-host should hit :8400 directly.
      - "127.0.0.1:8400:8400"
    volumes:
      - ./server:/app
      - backend_uploads:/home/stable/server/uploads
      # Finished call-audio recordings, written by the egress service. Read-
      # only here: the backend only picks files up for the Meeting-Ops
      # hand-off; it never writes or deletes them.
      - egress_out:/egress-out:ro
    environment:
      # production => SQLAlchemy echo OFF (dev leaked every SQL statement +
      # message body to stdout) and JSON structured logs.
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8400
      # Instance tenancy binding (offering C). Empty = community/ownership mode.
      - STABLE_ORG_ID=${STABLE_ORG_ID:-}
      - ORG_ID=${STABLE_ORG_ID:-}
      # Container names, not service aliases: this backend sits on the shared
      # `web` network where the flagship stack aliases the SAME short names
      # (postgres/redis/livekit/backend) — short names are a cross-stack
      # roulette. Container names are globally unique on this host.
      - DATABASE_URL=postgresql+asyncpg://stable:${POSTGRES_PASSWORD:-stable_dev_password_2026}@stable-postgres:5432/stable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@stable-redis:6379/0
      - QDRANT_URL=${QDRANT_URL:-http://unicorn-qdrant:6333}
      - LIVEKIT_URL=ws://stable-livekit:7880
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-wss://livekit.magicunicorn.dev}
      - LIVEKIT_API_URL=http://stable-livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-APIStable2026}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-stable_secret_change_in_production_2026}
      - INTERNAL_AGENT_SECRET=${INTERNAL_AGENT_SECRET:-}
      # Only the BACKEND validates key-admin bearers; the agents sidecar
      # never mints keys, so it deliberately does NOT receive this.
      - GATEWAY_KEY_ADMIN_SECRET=${GATEWAY_KEY_ADMIN_SECRET:-}
      - GATEWAY_ENABLED=${GATEWAY_ENABLED:-true}
      - UPLOAD_URL_SECRET=${UPLOAD_URL_SECRET:-}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-uchub}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-stable}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth.unicorncommander.ai}
      - BRIGADE_BASE_URL=${BRIGADE_BASE_URL:-https://brigade.magicunicorn.dev/api/v1/openai/v1}
      # Brigade owns agent portraits. Explicit roster avatarUrl wins; this
      # convention fills every built-in agent safely from the same origin.
      - BRIGADE_AVATAR_BASE_URL=${BRIGADE_AVATAR_BASE_URL:-https://brigade.magicunicorn.dev/avatars}
      - BRIGADE_API_KEY=${BRIGADE_API_KEY:-}
      - BRIGADE_WORKER_AGENT_NAME=${BRIGADE_WORKER_AGENT_NAME:-stable-brigade}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8401,https://stable.magicunicorn.dev}
      - MS_GRAPH_TENANT_ID=${MS_GRAPH_TENANT_ID:-}
      - MS_GRAPH_CLIENT_ID=${MS_GRAPH_CLIENT_ID:-}
      - MS_GRAPH_CLIENT_SECRET=${MS_GRAPH_CLIENT_SECRET:-}
      - MS_GRAPH_FROM_ADDRESS=${MS_GRAPH_FROM_ADDRESS:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://stable.magicunicorn.dev}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:aaron@magicunicorn.tech}
      - INCOMING_WEBHOOK_SECRET=${INCOMING_WEBHOOK_SECRET:-}
      - PROJECTOPS_SERVICE_JWT=${PROJECTOPS_SERVICE_JWT:-}
      - PROJECTOPS_MCP_URL=${PROJECTOPS_MCP_URL:-https://api.projectops.magicunicorn.dev/api/v1/mcp}
      - PROJECTOPS_DASHBOARD_URL=${PROJECTOPS_DASHBOARD_URL:-https://projectops.magicunicorn.dev}
      # Meeting-Ops call-transcript federation (optional). Empty URL = accept
      # exports locally only; URL + scoped PAT + org are required to forward.
      - MEETING_OPS_URL=${MEETING_OPS_URL:-}
      - MEETING_OPS_INGEST_PATH=${MEETING_OPS_INGEST_PATH:-/api/v1/sessions/ingest}
      - MEETING_OPS_API_KEY=${MEETING_OPS_API_KEY:-}
      - MEETING_OPS_ORG_SLUG=${MEETING_OPS_ORG_SLUG:-}
      - MEETING_OPS_ENABLED=${MEETING_OPS_ENABLED:-false}
      - MEETING_OPS_OUTBOX_PAYLOAD_RETENTION_HOURS=${MEETING_OPS_OUTBOX_PAYLOAD_RETENTION_HOURS:-168}
      - MEETING_OPS_OUTBOX_LEGAL_HOLD=${MEETING_OPS_OUTBOX_LEGAL_HOLD:-false}
      # Automatic call-audio recording (LiveKit egress) → Meeting-Ops attach.
      # Code default is OFF; this dogfood stack turns it ON. Fail-open: a
      # broken/absent egress service never breaks the call itself.
      - CALL_RECORDING_ENABLED=${CALL_RECORDING_ENABLED:-true}
      - CALL_RECORDING_OUTPUT_DIR=/egress-out
      # Direct container URL for the audio attach lane (big uploads must not
      # transit the CDN edge). Falls back to MEETING_OPS_URL when empty.
      - MEETING_OPS_UPLOAD_URL=${MEETING_OPS_UPLOAD_URL:-}
      # USER-scoped MO PAT (the transcript-ingest PAT is scope-locked and
      # cannot drive MO's uploads API).
      - MEETING_OPS_UPLOAD_PAT=${MEETING_OPS_UPLOAD_PAT:-}
      # Recording policy + composite video + storage + retention (design §8;
      # deploy/RECORDING.md). CALL_RECORDING_ENABLED above is the master
      # switch; the ROOM's recording_policy decides. Composites render the
      # broadcast page at <base>/broadcast/{room}/composite in the egress
      # worker's Chrome — the base must be reachable FROM THE EGRESS HOST.
      - CALL_RECORDING_COMPOSITE_BASE_URL=${CALL_RECORDING_COMPOSITE_BASE_URL:-}
      - CALL_RECORDING_COMPOSITE_PRESET=${CALL_RECORDING_COMPOSITE_PRESET:-H264_720P_30}
      - RECORDING_MAX_COMPOSITE=${RECORDING_MAX_COMPOSITE:-2}
      - CALL_RECORDING_MAX_HOURS=${CALL_RECORDING_MAX_HOURS:-6}
      - CALL_RECORDING_RETENTION_DAYS=${CALL_RECORDING_RETENTION_DAYS:-30}
      # S3-compatible storage for finished recordings (Garage / Studio
      # Storage). Empty endpoint = files stay on the egress volume until the
      # retention sweep. Keys live in .env only — never in this file, never
      # in logs.
      - RECORDING_S3_ENDPOINT=${RECORDING_S3_ENDPOINT:-}
      - RECORDING_S3_BUCKET=${RECORDING_S3_BUCKET:-}
      - RECORDING_S3_ACCESS_KEY=${RECORDING_S3_ACCESS_KEY:-}
      - RECORDING_S3_SECRET_KEY=${RECORDING_S3_SECRET_KEY:-}
      - RECORDING_S3_REGION=${RECORDING_S3_REGION:-garage}
      - RECORDING_S3_PATH_STYLE=${RECORDING_S3_PATH_STYLE:-true}
      - RECORDING_S3_PREFIX=${RECORDING_S3_PREFIX:-stable-recordings/}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - READINESS_REQUIRE_OBSERVABILITY=${READINESS_REQUIRE_OBSERVABILITY:-false}
      - READINESS_REQUIRE_BUILD_PROVENANCE=${READINESS_REQUIRE_BUILD_PROVENANCE:-true}
      # Voice proxies (browser + MCP cannot reach LAN-only GPU hosts).
      # TTS = kokoro-ha; STT = Parakeet OpenAI shim (Amanuensis-compatible).
      - KOKORO_BASE_URL=${KOKORO_BASE_URL:-http://192.168.10.10:8883}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-af_heart}
      - TTS_READ_ALOUD_DEFAULT_VOICE=${TTS_READ_ALOUD_DEFAULT_VOICE:-am_adam}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-http://192.168.10.68:8011/v1}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - stable-net
      - web
      - vectordb
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Public API router.
      - "traefik.http.routers.stable-api.rule=Host(`stable.magicunicorn.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.stable-api.entrypoints=websecure"
      - "traefik.http.routers.stable-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.stable-api.loadbalancer.server.port=8400"
      # WebSocket bypass host. stable-ws.magicunicorn.dev is a DNS-only (grey)
      # record straight to this box: Cloudflare's proxy stalls browser WebSocket
      # upgrades once Chrome moves the origin to HTTP/3 (extended CONNECT hangs
      # in CONNECTING forever, 2026-07-31), so the web client's wsUrl points
      # here and the socket never transits the CDN. Scoped to /ws only — no
      # other backend surface is exposed on this host.
      - "traefik.http.routers.stable-ws.rule=Host(`stable-ws.magicunicorn.dev`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.stable-ws.entrypoints=websecure"
      - "traefik.http.routers.stable-ws.tls.certresolver=letsencrypt"
      # http/1.1-only ALPN (ws-http1 tls option, traefik dynamic dir): Go 1.24
      # h2 advertises RFC 8441 extended CONNECT and Chrome then sends the
      # websocket as an h2 CONNECT stream, which stalls in traefik forever.
      # Classic h1.1 upgrade is the only path every hop handles correctly.
      - "traefik.http.routers.stable-ws.tls.options=ws-http1@file"
      # Route via the web nginx (service `stable`, port 80), NOT stable-api:
      # nginx's /ws location proxies upgrades to the backend AND rejects an
      # oversized request line with a fast 414. uvicorn answers one with
      # silence — a legacy client that still puts its (huge) token in the URL
      # would hang, and every hung handshake camps a slot in Chrome's per-host
      # pending-WebSocket queue, starving the healthy frame-auth clients.
      - "traefik.http.routers.stable-ws.service=stable"
      # B2: take the internal agent surface OFF the public edge. A higher-
      # priority router captures /api/v1/internal/* and runs it through an
      # ipAllowList that permits only loopback — so every request arriving via
      # Traefik (i.e. from the internet) gets 403. Legitimate agent traffic
      # never transits Traefik: the agents sidecar calls http://backend:8400
      # directly over the Docker network, bypassing this router entirely. The
      # constant-time internal bearer (B1) remains as defense-in-depth.
      - "traefik.http.routers.stable-internal-deny.rule=Host(`stable.magicunicorn.dev`) && PathPrefix(`/api/v1/internal`)"
      - "traefik.http.routers.stable-internal-deny.entrypoints=websecure"
      - "traefik.http.routers.stable-internal-deny.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stable-internal-deny.priority=1000"
      - "traefik.http.routers.stable-internal-deny.service=stable-api"
      - "traefik.http.routers.stable-internal-deny.middlewares=stable-internal-denylist"
      - "traefik.http.middlewares.stable-internal-denylist.ipallowlist.sourcerange=127.0.0.1/32"
      # B2-fix (2026-07-21): the deny router above is `entrypoints=websecure`
      # ONLY. The SPA's `stable-http` router serves the same Host on entrypoint
      # `web` (:80) and its nginx proxies `location /api/ -> http://backend`,
      # so port 80 bypassed the ipAllowList entirely: verified off-host,
      # https:// -> 403 but http:// -> 422 (FastAPI body validation = the
      # handler was REACHED). Traefik matches routers per-entrypoint, so the
      # deny must be declared on `web` as its own router. Priority 1000 beats
      # `stable-http`, so this wins before the SPA/nginx path.
      - "traefik.http.routers.stable-internal-deny-http.rule=Host(`stable.magicunicorn.dev`) && PathPrefix(`/api/v1/internal`)"
      - "traefik.http.routers.stable-internal-deny-http.entrypoints=web"
      - "traefik.http.routers.stable-internal-deny-http.priority=1000"
      - "traefik.http.routers.stable-internal-deny-http.service=stable-api"
      - "traefik.http.routers.stable-internal-deny-http.middlewares=stable-internal-denylist"
    healthcheck:
      # Liveness controls restarts. Readiness is checked by the deploy gate;
      # dependency outages must not create a restart loop.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/live')"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Agent Runtime — LiveKit Agents SDK: AI participants in rooms
  # ==========================================================================
  agent-runtime:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: stable-agents
    restart: unless-stopped
    command: ["start"]
    volumes:
      - ./agents:/app
      # Puppet art for the relay's camera tracks (agent_runtime/puppet_video.py).
      # The web client ships the same set; the worker only reads it.
      - ./web/public/agent-puppets:/app/puppets:ro
    environment:
      # Container names, not aliases — see the backend note. The agents worker
      # actually hit the flagship LiveKit with dogfood keys (401 invalid API
      # key in flagship logs, 2026-08-07) via the `livekit` alias on `web`.
      # Crew tile manifest (frame colour, display name, internal/external kind).
      - PUPPET_MANIFEST=/app/puppets/manifest.json
      - LIVEKIT_URL=ws://stable-livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-APIStable2026}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-stable_secret_change_in_production_2026}
      - INTERNAL_AGENT_SECRET=${INTERNAL_AGENT_SECRET:-}
      - STABLE_BACKEND_URL=http://stable-backend:8400
      - REDIS_URL=redis://:${REDIS_PASSWORD}@stable-redis:6379/1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - BRIGADE_BASE_URL=${BRIGADE_BASE_URL:-https://brigade.magicunicorn.dev/api/v1/openai/v1}
      - BRIGADE_API_KEY=${BRIGADE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Self-hosted voice services.
      # TTS = kokoro-ha (nginx HA front on this host :8883 -> uc-1 GTX1070 primary,
      # bigboy CPU fallback). Was old-uc-1 100.78.236.160:8881 which DIED in the
      # 2026-07-01 uc-1 rebuild, silently killing voice (TTS timeout -> job killed
      # -> looked like STT was broken). Move-proof per gateway-canonical doctrine:
      # kokoro moves again = edit kokoro-ha upstream, Stable untouched. 2026-07-03.
      # STT = PARAKEET (the Meeting-Ops parakeet-openai-shim on midboy1, host-net
      # :8011, OpenAI-compatible /v1/audio/transcriptions, GPU, ~0.3s, returns ""
      # on silence — better than whisper). Was uc-1 Amanuensis (went OFFLINE) then
      # briefly bigboy unicorn-whisper (CPU fallback, still up at :8092 if needed).
      # 2026-06-22.
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-http://192.168.10.68:8011/v1}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - KOKORO_BASE_URL=${KOKORO_BASE_URL:-http://192.168.10.10:8883}
      - METERING_REPORT_URL=${METERING_REPORT_URL:-http://100.126.207.157:8084/api/v1/metered/report}
      - STABLE_METERING_ORG_ID=${STABLE_METERING_ORG_ID:-stable-internal}
      - METERING_KEY=${METERING_KEY:-}
    depends_on:
      livekit:
        condition: service_healthy
      backend:
        condition: service_healthy
    # stable-net ONLY — see the postgres note. Outbound calls to public URLs
    # (Brigade, Kokoro, Parakeet) leave via host NAT, not the `web` network.
    networks:
      - stable-net

  # ==========================================================================
  # Web Client — React/TypeScript served by nginx
  # ==========================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: stable-web
    restart: unless-stopped
    ports:
      - "8401:80"
    environment:
      # The nginx template resolves its API upstream per-request; the short
      # service name `backend` is ambiguous on the shared `web` network, so
      # each stack names its own backend CONTAINER here.
      - STABLE_BACKEND_HOST=stable-backend
    depends_on:
      - backend
    volumes:
      # Survive image rebuilds — these public assets are not bundled by Vite,
      # they live alongside the dist output in /usr/share/nginx/html.
      - ./web/public/favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      # Federation server rail. The web image BAKES `[]` (the correct
      # single-instance default), so a deploy that federates must mount its own
      # list over it. This mount belongs HERE and not in an out-of-tree
      # `-f` override: `docker compose up` / scripts/deploy.sh pass no extra
      # -f, so an override-only mount is silently dropped on the next deploy —
      # nginx then serves the baked `[]`, the ServerRail renders empty, and
      # nothing errors. Point STABLE_INSTANCES_FILE at this deploy's list;
      # the default is the baked-equivalent empty list.
      - ${STABLE_INSTANCES_FILE:-./web/public/instances.json}:/usr/share/nginx/html/instances.json:ro
    networks:
      - stable-net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.stable.rule=Host(`stable.magicunicorn.dev`)"
      - "traefik.http.routers.stable.entrypoints=websecure"
      - "traefik.http.routers.stable.tls.certresolver=letsencrypt"
      - "traefik.http.services.stable.loadbalancer.server.port=80"
      - "traefik.http.routers.stable-http.rule=Host(`stable.magicunicorn.dev`)"
      - "traefik.http.routers.stable-http.entrypoints=web"
      - "traefik.http.routers.stable-http.service=stable"
      # Close the plaintext edge as a CLASS, not one path at a time. Port 80
      # served the entire app (session cookies, bearer tokens, the public API)
      # in cleartext, and any future router inherits the same hole. Scoped to
      # THIS router on purpose: a fleet-wide `entryPoints.web.http.redirections`
      # would hit ~25 unrelated services on this Traefik.
      # Verified safe before making it: no consumer speaks plain HTTP to this
      # host. The agents sidecar uses STABLE_BACKEND_URL=http://backend:8400
      # and the cross-app callers (email-ops, research-relay) use
      # http://stable-backend:8400 — all container-to-container on the Docker
      # network, never through Traefik.
      # ACME: this Traefik solves HTTP-01 on the `web` entrypoint. Traefik's
      # internal `acme-http@internal` router outranks docker-provider routers,
      # so /.well-known/acme-challenge is still answered. Cert renews ~Aug 23
      # (expires Sep 22) — confirm renewal succeeds before then.
      - "traefik.http.routers.stable-http.middlewares=stable-https-redirect"
      - "traefik.http.middlewares.stable-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.stable-https-redirect.redirectscheme.permanent=true"
networks:
  stable-net:
    driver: bridge
    name: stable-network
  web:
    external: true
  vectordb:
    external: true
    name: unicorn-vectordb

volumes:
  postgres_data:
    name: stable-postgres-data
  redis_data:
    name: stable-redis-data
  backend_uploads:
    name: stable-backend-uploads
  egress_out:
    name: stable-egress-out
