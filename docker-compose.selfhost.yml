# =============================================================================
# Unicorn Stable — SELF-HOST compose file
# =============================================================================
# This file is the single-box, end-user deployment of Stable. It is deliberately
# separate from docker-compose.yml (the operator/production file):
#
#   * no external networks (docker-compose.yml joins the shared `web` +
#     `vectordb` networks that only exist on our production hosts)
#   * no Traefik labels / hard-coded public hostnames
#   * no pinned container_name, so `docker compose -p <name>` can run several
#     stacks side by side and volumes stay project-scoped
#   * every published port is configurable via .env so the stack can be
#     remapped around whatever else the host is running
#   * an OPTIONAL bundled Keycloak (profile `keycloak`) because Stable's auth
#     is Keycloak OIDC and is NOT optional — see DEPLOYMENT.md
#   * an OPTIONAL agent runtime (profile `agents`)
#
# Do not run this by hand first: `./install.sh` generates .env,
# deploy/selfhost/livekit.yaml, deploy/selfhost/instances.json and the Keycloak
# realm import, then brings this file up. Use `./install.sh --env-only` if you
# want to drive `docker compose -f docker-compose.selfhost.yml` yourself.
# =============================================================================

name: stable-selfhost

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — rooms, messages, agents, knowledge, audit
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Loopback-only: for local psql / pg_dump. The app talks to postgres over
      # the compose network; nothing off-box should reach this port.
      - "127.0.0.1:${STABLE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      POSTGRES_DB: stable
      POSTGRES_USER: stable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — run ./install.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stable -d stable"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 — presence, typing, pub/sub, rate limiting, LiveKit state
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback-only, password-protected. Debug access: redis-cli -a <pw>.
      - "127.0.0.1:${STABLE_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — run ./install.sh}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------------------------------------------------------------------------
  # LiveKit SFU — realtime media + data channels
  # ---------------------------------------------------------------------------
  # The container listens on the SAME numbers you publish (install.sh writes
  # them into deploy/selfhost/livekit.yaml), so advertised ICE candidates match
  # what a browser can actually reach.
  livekit:
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    ports:
      - "${STABLE_LIVEKIT_WS_PORT:-7880}:${STABLE_LIVEKIT_WS_PORT:-7880}"        # WS signaling
      - "${STABLE_LIVEKIT_TCP_PORT:-7881}:${STABLE_LIVEKIT_TCP_PORT:-7881}"      # TCP media fallback
      - "${STABLE_LIVEKIT_UDP_PORT:-7882}:${STABLE_LIVEKIT_UDP_PORT:-7882}/udp"  # UDP media
    volumes:
      # Generated by install.sh from deploy/selfhost/livekit.selfhost.yaml.template
      - ./deploy/selfhost/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${STABLE_LIVEKIT_WS_PORT:-7880}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Keycloak — identity provider (profile: keycloak)
  # ---------------------------------------------------------------------------
  # Stable's auth IS Keycloak OIDC; there is no local-account mode. Either run
  # this bundled instance (default) or point KEYCLOAK_URL at one you operate
  # (./install.sh --no-keycloak). The bundled instance is served THROUGH the
  # web container's nginx under /auth on the same origin as the app, so the
  # browser, the backend, and the token issuer all agree on one URL:
  #   http://<STABLE_HOST>:<web port>/auth
  # It is intentionally NOT published on a host port of its own.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    volumes:
      # install.sh renders deploy/selfhost/keycloak-import/stable-realm.json.
      # Import is skipped when the realm already exists (idempotent restarts).
      - ./deploy/selfhost/keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Stable backend — FastAPI (migrations run in the entrypoint, then uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${STABLE_GIT_SHA:-unknown}
        GIT_SHA_FULL: ${STABLE_GIT_SHA_FULL:-unknown}
        BUILD_TIME: ${STABLE_BUILD_TIME:-unknown}
    restart: unless-stopped
    ports:
      # Loopback-only: browsers reach the API through the web container's
      # nginx (/api + /ws on the web port). This direct port is for local
      # debugging and gateway key administration.
      - "127.0.0.1:${STABLE_BACKEND_PORT:-8400}:8400"
    volumes:
      - backend_uploads:/home/stable/server/uploads
    environment:
      # production => JSON logs, no SQL echo, and the startup secret guard ON
      # (the backend refuses to boot on the world-known default LiveKit secret).
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8400
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STABLE_GIT_SHA=${STABLE_GIT_SHA:-unknown}
      # Community/ownership mode by default. Set a UUID for per-org tenancy.
      - STABLE_ORG_ID=${STABLE_ORG_ID:-}
      - ORG_ID=${STABLE_ORG_ID:-}
      # --- core wiring (service names on the project-scoped network) ---
      - DATABASE_URL=postgresql+asyncpg://stable:${POSTGRES_PASSWORD}@postgres:5432/stable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LIVEKIT_URL=ws://livekit:${STABLE_LIVEKIT_WS_PORT:-7880}
      - LIVEKIT_API_URL=http://livekit:${STABLE_LIVEKIT_WS_PORT:-7880}
      # URL handed to BROWSERS in token responses — must be reachable from them.
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL must be set — run ./install.sh}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set — run ./install.sh}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set — run ./install.sh}
      # --- secrets (all REQUIRED in production; install.sh generates them) ---
      - INTERNAL_AGENT_SECRET=${INTERNAL_AGENT_SECRET:-}
      - GATEWAY_KEY_ADMIN_SECRET=${GATEWAY_KEY_ADMIN_SECRET:-}
      - UPLOAD_URL_SECRET=${UPLOAD_URL_SECRET:-}
      # --- identity (REQUIRED; see DEPLOYMENT.md "Identity") ---
      # KEYCLOAK_URL doubles as the JWKS fetch base AND the expected token
      # issuer, so it must be the browser-facing URL and must be reachable
      # from inside this container. The bundled profile satisfies both with
      # http://<STABLE_HOST>:<web port>/auth.
      - KEYCLOAK_URL=${KEYCLOAK_URL:?KEYCLOAK_URL must be set — run ./install.sh}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-stable}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-stable-backend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      # --- app URLs ---
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8401}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8401}
      # --- OPTIONAL: Brigade agent fleet (unset = agents degrade gracefully) ---
      - BRIGADE_BASE_URL=${BRIGADE_BASE_URL:-}
      - BRIGADE_API_BASE_URL=${BRIGADE_API_BASE_URL:-}
      - BRIGADE_AVATAR_BASE_URL=${BRIGADE_AVATAR_BASE_URL:-}
      - BRIGADE_API_KEY=${BRIGADE_API_KEY:-}
      - BRIGADE_WORKER_AGENT_NAME=${BRIGADE_WORKER_AGENT_NAME:-stable-brigade}
      # --- OPTIONAL: voice proxies (OpenAI-compatible endpoints) ---
      - KOKORO_BASE_URL=${KOKORO_BASE_URL:-}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-af_heart}
      - TTS_READ_ALOUD_DEFAULT_VOICE=${TTS_READ_ALOUD_DEFAULT_VOICE:-am_adam}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      # --- OPTIONAL: document RAG (needs Qdrant + an embeddings service) ---
      - RAG_ENABLED=${RAG_ENABLED:-false}
      - QDRANT_URL=${QDRANT_URL:-}
      - INFINITY_URL=${INFINITY_URL:-}
      - CONTEXT_ENABLED=${CONTEXT_ENABLED:-false}
      # --- OPTIONAL: Meeting-Ops transcript federation ---
      - MEETING_OPS_ENABLED=${MEETING_OPS_ENABLED:-false}
      - MEETING_OPS_URL=${MEETING_OPS_URL:-}
      - MEETING_OPS_INGEST_PATH=${MEETING_OPS_INGEST_PATH:-/api/v1/sessions/ingest}
      - MEETING_OPS_API_KEY=${MEETING_OPS_API_KEY:-}
      - MEETING_OPS_ORG_SLUG=${MEETING_OPS_ORG_SLUG:-}
      # --- OPTIONAL: email, web push, webhooks, Project-Ops, observability ---
      - MS_GRAPH_TENANT_ID=${MS_GRAPH_TENANT_ID:-}
      - MS_GRAPH_CLIENT_ID=${MS_GRAPH_CLIENT_ID:-}
      - MS_GRAPH_CLIENT_SECRET=${MS_GRAPH_CLIENT_SECRET:-}
      - MS_GRAPH_FROM_ADDRESS=${MS_GRAPH_FROM_ADDRESS:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - INCOMING_WEBHOOK_SECRET=${INCOMING_WEBHOOK_SECRET:-}
      - PROJECTOPS_SERVICE_JWT=${PROJECTOPS_SERVICE_JWT:-}
      - PROJECTOPS_MCP_URL=${PROJECTOPS_MCP_URL:-}
      - PROJECTOPS_DASHBOARD_URL=${PROJECTOPS_DASHBOARD_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      - READINESS_REQUIRE_OBSERVABILITY=${READINESS_REQUIRE_OBSERVABILITY:-false}
      - READINESS_REQUIRE_BUILD_PROVENANCE=${READINESS_REQUIRE_BUILD_PROVENANCE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      # NOTE: no depends_on for keycloak — it is profile-gated (compose rejects
      # dependencies on disabled services) and the backend already tolerates a
      # late IdP: JWKS fetch retries every 60s until Keycloak answers.
    healthcheck:
      # Liveness only; /health (readiness) additionally requires DB, Redis,
      # LiveKit AND a reachable Keycloak realm (JWKS). install.sh waits on it.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/live')"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Web client — React SPA behind nginx; also the front proxy for /api, /ws
  # and (bundled profile) /auth → Keycloak, so one origin serves everything.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${STABLE_GIT_SHA:-unknown}
        GIT_SHA_FULL: ${STABLE_GIT_SHA_FULL:-unknown}
        BUILD_TIME: ${STABLE_BUILD_TIME:-unknown}
    restart: unless-stopped
    ports:
      - "${STABLE_WEB_PORT:-8401}:80"
    environment:
      # nginx template substitutions (see deploy/selfhost/nginx.selfhost.conf.template)
      - STABLE_BACKEND_HOST=backend
      - STABLE_KEYCLOAK_UPSTREAM=${STABLE_KEYCLOAK_UPSTREAM:-keycloak:8080}
      # Extra CSP connect-src entries so the browser may open the LiveKit
      # signaling socket on its separate port. install.sh fills this in.
      - STABLE_CSP_EXTRA_CONNECT=${STABLE_CSP_EXTRA_CONNECT:-}
      - STABLE_CSP_EXTRA_SCRIPT=${STABLE_CSP_EXTRA_SCRIPT:-}
      - STABLE_CSP_EXTRA_FRAME=${STABLE_CSP_EXTRA_FRAME:-}
    volumes:
      # Self-host nginx vhost (adds the /auth proxy + self-contained CSP).
      - ./deploy/selfhost/nginx.selfhost.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Instance descriptor consumed by the SPA at runtime — this is how the
      # web app learns its Keycloak URL/realm/client without a rebuild.
      - ${STABLE_INSTANCES_FILE:-./deploy/selfhost/instances.json}:/usr/share/nginx/html/instances.json:ro
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Agent runtime — LiveKit Agents workers (profile: agents, OPTIONAL)
  # ---------------------------------------------------------------------------
  # Voice/AI participants. Needs at least one model provider (Brigade or a
  # provider API key) plus STT/TTS endpoints to be genuinely useful.
  agent-runtime:
    build:
      context: ./agents
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${STABLE_GIT_SHA:-unknown}
        GIT_SHA_FULL: ${STABLE_GIT_SHA_FULL:-unknown}
        BUILD_TIME: ${STABLE_BUILD_TIME:-unknown}
    profiles: ["agents"]
    restart: unless-stopped
    command: ["start"]
    environment:
      - LIVEKIT_URL=ws://livekit:${STABLE_LIVEKIT_WS_PORT:-7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - INTERNAL_AGENT_SECRET=${INTERNAL_AGENT_SECRET:-}
      - STABLE_BACKEND_URL=http://backend:8400
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BRIGADE_BASE_URL=${BRIGADE_BASE_URL:-}
      - BRIGADE_API_KEY=${BRIGADE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - KOKORO_BASE_URL=${KOKORO_BASE_URL:-}
    depends_on:
      livekit:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
